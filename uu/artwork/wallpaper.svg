<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- UU-huisstijlkleuren: geel #FFCD00, rood #C00A35. Geen officieel logo. -->
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- Rustige concentrische bogen rechtsonder -->
  <g fill="none" stroke="#FFCD00" stroke-width="3">
    <circle cx="3840" cy="2160" r="700" stroke-opacity="0.40"/>
    <circle cx="3840" cy="2160" r="1000" stroke-opacity="0.28"/>
    <circle cx="3840" cy="2160" r="1300" stroke-opacity="0.18"/>
    <circle cx="3840" cy="2160" r="1600" stroke-opacity="0.11"/>
    <circle cx="3840" cy="2160" r="1900" stroke-opacity="0.06"/>
  </g>

  <!-- Woordmerk linksonder -->
  <rect x="220" y="1792" width="12" height="148" fill="#FFCD00"/>
  <text x="270" y="1862" font-family="Inter" font-weight="700" font-size="76" fill="#FFFFFF">Universiteit Utrecht</text>
  <text x="272" y="1930" font-family="Inter" font-weight="400" font-size="42" fill="#FFCD00" letter-spacing="1">Digitale werkplek</text>
</svg>
